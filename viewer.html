<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Просмотр лендинга — Амфодент</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef1f4;color:#13283d;font:14px system-ui,-apple-system,"Segoe UI",sans-serif}nav{display:flex;flex-wrap:wrap;align-items:center;gap:12px;max-width:1488px;padding:18px 24px;margin:auto}nav a{color:#405366;text-decoration:none;border-radius:9px;padding:10px 14px;background:#fff}nav a:hover{background:#e0e9ee}nav a[aria-current=page]{background:#13283d;color:#fff}.back{margin-right:auto}main{padding:0 24px 24px;max-width:1488px;margin:auto}.stage{position:relative;overflow:hidden;width:100%;background:#fff;border-radius:12px;box-shadow:0 8px 30px #13283d12}iframe{display:block;width:1440px;height:900px;border:0;transform-origin:0 0}@media(max-width:600px){nav{padding:12px;gap:8px}nav a{padding:9px 11px}main{padding:0 12px 12px}.back{width:100%}}
</style>
</head>
<body>
<nav aria-label="Выбор варианта"><a class="back" href="index.html">← Все варианты</a><a id="enamel" href="viewer.html?variant=enamel">1 · Эмаль</a><a id="sterile-light" href="viewer.html?variant=sterile-light">2 · Стерильный свет</a></nav>
<main><div class="stage"><iframe title="Макет первого экрана лендинга"></iframe></div></main>
<script>
const variants={enamel:{name:'Эмаль',src:'enamel/Main.dc.html'},'sterile-light':{name:'Стерильный свет',src:'sterile-light/Sterile.dc.html'}};
const requested=new URLSearchParams(location.search).get('variant');
const key=Object.hasOwn(variants,requested)?requested:'enamel';
const variant=variants[key];
const frame=document.querySelector('iframe');
const stage=document.querySelector('.stage');
document.title=variant.name+' — Амфодент';
document.getElementById(key).setAttribute('aria-current','page');
frame.title=variant.name+' — первый экран лендинга';
frame.src=variant.src;
function fit(){const scale=Math.min(stage.clientWidth/1440,1);frame.style.transform='scale('+scale+')';stage.style.height=(900*scale)+'px';}
new ResizeObserver(fit).observe(stage);fit();
</script>
</body>
</html>
